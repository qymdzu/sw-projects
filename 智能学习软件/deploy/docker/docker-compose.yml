# === 调试 Docker Compose 编排 — 智能学习软件 ===
# 用途：调试环境（后端 + 数据库 + 前端静态代理）
# 启动：docker compose -f deploy/docker/docker-compose.yml up -d --build

version: "3.8"

services:
  # ─── 后端服务 ─────────────────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile
    image: smart-learning-backend:debug
    container_name: smart-learning-backend
    ports:
      - "${API_PORT:-8081}:8080"      # API 端口（默认映射 8081）
      - "${DEBUG_PORT:-2345}:2345"     # Delve 调试端口
    environment:
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-debug}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-smart_learning}
      - DB_PASSWORD=${DB_PASSWORD:-smart_learning}
      - DB_NAME=${DB_NAME:-smart_learning}
      - DB_SSLMODE=disable
      - DB_MAX_OPEN_CONNS=50
      - DB_MAX_IDLE_CONNS=10
      - JWT_SECRET=${JWT_SECRET:-dev-secret-please-replace-in-production}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-2h}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-168h}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - APP_ENV=${APP_ENV:-dev}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ─── 数据库 ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: smart-learning-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-smart_learning}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-smart_learning}
      - POSTGRES_DB=${DB_NAME:-smart_learning}
      - TZ=Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smart_learning} -d ${DB_NAME:-smart_learning}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  # ─── 前端 Nginx 静态代理 ─────────────────────────────
  frontend:
    image: nginx:1.27-alpine
    container_name: smart-learning-frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # 前端构建产物
      - ../../frontend/dist:/usr/share/nginx/html:ro
      # Nginx 配置（代理 /api 到后端）
      - ./nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:
    driver: local

networks:
  app-network:
    driver: bridge